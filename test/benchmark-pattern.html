<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Sidepad 성능 측정</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#152a23;color:#e3efd1;font:24px "Segoe UI",sans-serif}
main{height:100vh;padding:7vh 7vw;background-image:linear-gradient(#dce9b615 1px,transparent 1px),linear-gradient(90deg,#dce9b615 1px,transparent 1px);background-size:64px 64px}
h1{font-size:58px;margin:0 0 20px}p{color:#b5c6ad}.bar{height:90px;width:25vw;background:#cce59c;border-radius:12px;animation:slide 4s linear infinite alternate;margin-top:40px}.bar.second{background:#7dbea0;animation-direction:alternate-reverse}.bar.third{background:#e3c27c;animation-duration:3s}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(55vw)}}footer{position:absolute;bottom:7vh;font-size:18px;color:#a0b59a}
</style></head><body><main><h1>Sidepad 성능 측정</h1><p>1920 × 1080 · 같은 움직임으로 저지연 / 표준 모드를 비교합니다.</p><div class="bar"></div><div class="bar second"></div><div class="bar third"></div><footer>측정이 끝나면 이 창은 자동으로 닫힙니다. 기존 Sidepad 연결은 유지됩니다.</footer></main></body></html>
